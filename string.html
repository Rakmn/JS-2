<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // data string adalah tipe data teks dan biasanya menggunakan tanda petik
        document.writeln("<h1>h1</h1>");
        document.writeln("My name is RAKMN");
        document.writeln("<br>");
        document.writeln(`My name is RAKMN`);
        document.writeln("<br>");

        //Hubungan dengan operator +
        let kelas = " X.4"
        document.writeln("Name :" + " RAKMN");
        document.writeln("<br>");
        document.writeln("Kelas" + kelas);

        //Escape squence
        document.writeln("<h1>Escape squence</h1>");
        document.writeln("<br>");
        document.writeln("Halo, saya \"Rakmn\"");
        document.writeln("<br>");
        document.writeln("<br>");
    </script>
</body>
</html>
