<body>
    <script>
        const lulus = 80    ;

        if (lulus >= 80)
        {document.writeln("<p>Lulus</p>");}

        {document.writeln("<p>Tidak lulus</p>")}

            case (nilai >= 80) :

            case nilai >= 70 :
                document.writeln("<h1>C</h1>");break;

        document.writeln(murid.length)

        // Ternary Operator
        let value = 75

        // } else {
        //     console.log("Remedial")
        // }

        let hasil = value > 75 ? "Lanjut" : "Remedial";

        // }

        let kualitas = jumlah ?? "Kurang baik"
        console.log(kualitas)

        // For loop

            console.log(n)
        }

        // While loop

        while (a <= 10) {
            console.log(a)
            a++
        }
