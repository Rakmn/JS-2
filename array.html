<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let buah = ["Apple", "Mango", "Pineapple", "Avocado"]
        document.writeln(buah.length);
        document.writeln("</br>");
        document.writeln(buah[2]);
        document.writeln("</br>");
        document.writeln(buah[3] = "Pine")
        document.writeln(buah[3]);
        document.writeln("</br>");
        document.writeln(buah.push("Cherry", "Banana", "Coconut"));
        document.writeln(buah[5]);
        document.writeln("</br>");

        let hewan = ["Kucing", "Anjing", "Kelinci"]
        document.writeln(hewan[1]);
        document.writeln("</br>");
        document.writeln(hewan[0] = "Singa");
        document.writeln(hewan.push("Burung"));
        document.writeln(delete hewan[3]);
        console.info(hewan)
    </script>
</body>
</html>
