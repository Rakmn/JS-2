<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Variable adalah tempat untuk menyimpan data dalam program
        document.writeln("<h1> Variable </h1> <br>") ;
        var nama = "RAKMN" ;
        var kelas = "X.4" ;
        var umur = 16 ;

        document.writeln("Hi my name is " + nama) ;
        document.writeln("<br>");
        document.writeln("I'm from " + kelas) ;
        document.writeln("<br>");
        document.writeln("I'm " + umur + " years old") ;

        //Dynamic languange adalah variable yang dapat berubah kapanpun
        document.writeln("<h1> Dynamic Languange </h1>");
        //String type
        var data = "Amileft"
        document.writeln(data);
        document.writeln("<br>");
        //Number type
        var data = 2015
        document.writeln("data");
        document.writeln("<br>");
        //Boolean type
        data = true;
        document.writeln(data);
        document.writeln("<br>");
        
        //Mengubah dan mendeklarasikan Variabel
        var fullname;
        fullname = "Lantingariq"
        fullname = "RAKMN"
        document.writeln(fullname);

        //Let and Const variable
        //Let adalah variable yang bisa di ubah setelah di buat

        document.writeln("<h1> Let Variable </h1><br>");
        let name = "RAKMN";
        name = "Lantingariq";
        document.writeln(name);

        //Const adalah variabel yang di gunakan tanpa bisa mengubah nilainya jika sudah di buat

        document.writeln("<h1>Const Variable</h1><br>");
        const PI = 3.14;
        // PI = 10
        document.writeln(PI);

        //Ex:
        // Vol balok p=10, l=7, t=4

        let p = 10;
        let l = 7;
        let t = 4;
        const volBalok = p * l * t;
        document.writeln("Volume balok = " + volBalok + "m3" + "<br>");

        //Rules variable
        let alamat;
        let _alamat;
        let $alamat
        let alamat_lengkap
        
    </script>
</body>
</html>
