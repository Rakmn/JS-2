<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for (let i = 1; i <= 20; i++){
            if (i % 2 === 0){
                continue;
            }
            console.log(`Perulangan angka ganjil ke - ${i}`);
        }
            // break

            let counter = 1;
            while(true){
                console.log(`Perulangan ke ${counter}`);
                counter++;

                if (counter > 10){
                    break;
                }
                
        }
    </script>
</body>
</html>
